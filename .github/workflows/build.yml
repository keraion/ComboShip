name: Build (reusable)

# Reusable build pipeline: the fast gate (conflict markers + clang-format) followed by the full
# Windows Release build + cpack ZIP. Called by build-artifacts.yml (PR / develop nightly) and
# release.yml (v* tags), so the release ZIP is built identically to what nightly tested.
# See docs/UPSTREAM_MERGES.md and CMake/CPackProjectConfig.cmake (the combo/ship/2s2h ZIP components).
#
# Compile caching: every develop push saves a ccache object cache; PR and tag builds restore the
# newest develop cache and only recompile what their diff touches (a cache miss falls back to a plain
# cl.exe compile, so a stale or evicted cache costs time, never correctness). See the ccache steps.

on:
  workflow_call:
    inputs:
      # The raw cpack .zip, uploaded for release.yml to attach as a Release asset. An artifact is
      # itself zipped on download, so this one arrives as a zip-inside-a-zip — fine for release.yml
      # (it unwraps it) but noise on a PR, where pr-artifacts.yml would advertise it as a download.
      release_zip:
        type: boolean
        default: false
      # comborando + its runtime DLLs (~60MB). validate-seed.yml only ever fetches this from the
      # latest successful develop run, so building/uploading it on a PR is dead weight.
      validator:
        type: boolean
        default: false

jobs:
  # Fast gate so the ~40-min Windows build doesn't run on a PR that already has committed conflict
  # markers or formatting errors. Mirrors conflict-check.yml + clang-format.yml (which remain the
  # branch-protection required checks); this copy exists only to give the build a `needs:` dependency,
  # since GitHub can't make this workflow depend on a job in another file. If the gate fails the build
  # is skipped (reported as success — a skipped job never blocks); the standalone required checks still
  # go red and block the merge. See docs/UPSTREAM_MERGES.md.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Scan for conflict markers
        shell: bash
        run: |
          set -uo pipefail
          hits=$(git grep -nE '^(<{7}|>{7}|\|{7})( |$)' -- . \
                 ':(exclude).github/workflows/build.yml' \
                 ':(exclude).github/workflows/build-artifacts.yml' \
                 ':(exclude).github/workflows/conflict-check.yml' || true)
          if [ -n "$hits" ]; then
            echo "::error::Unresolved conflict markers — skipping the build until resolved:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "No conflict markers."
      - name: clang-format (clang-format-14)
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format-14
          ./run-clang-format.sh
          git diff --exit-code

  build-artifacts:
    needs: gate
    # Pin to VS 2022 image — matches the "Visual Studio 17 2022" generator below (see build-windows.yml).
    runs-on: windows-2022
    env:
      # ccache needs these to cache compiles that use a precompiled header (2ship's). pch_defines
      # and time_macros are what its manual requires for PCH; include_file_mtime/ctime stop direct
      # mode from refusing headers whose timestamps look "too new", which on a fresh checkout is all
      # of them. time_macros means a __DATE__ user can be served from cache, but the only ones
      # (soh/mm src/boot/build.c) also embed the git hash, so they change, and miss, every commit.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v5

      # Compiler cache. MSBuild's own incremental build is useless on a runner: a fresh checkout stamps
      # every source newer than any cached .obj, so it recompiled everything (~35 min) even when the
      # old build/x64 cache hit. ccache keys on source + included-header content instead, so restoring
      # develop's cache turns a PR build into a partial compile of only the files the PR changes.
      # Only develop saves (one entry per push; unused entries age out of the 10 GB repo budget);
      # PRs and v* tags restore the newest develop entry via restore-keys.
      #
      # ccache rather than sccache (which upstream 2ship/LUS use with Ninja): under MSBuild an
      # in-process cache is the right shape. sccache's client/server split hid cl.exe's diagnostics
      # (MSBuild hands cl.exe a pipe handle in VS_UNICODE_OUTPUT that means nothing in the server) and
      # it has no preprocessor-cache mode for MSVC, so every hit still ran the preprocessor (~0.2-2 s
      # on the decomp headers) and each separate `cmake --build` step re-paid that for its whole
      # dependency tree. ccache runs cl.exe as its own child, so MSBuild sees errors natively, and its
      # direct mode serves hits by hashing the recorded include list, without running cl.exe at all.
      #
      # Sizing: a full Release object set (LTCG objects, no debug info) is ~3 GB uncompressed;
      # ccache zstd-compresses entries. Each develop push stores one entry, so the repo's 10 GB cache
      # budget holds a few generations.
      #
      # Keys: the action prefixes both keys with "ccache-" and, with append-timestamp (default on),
      # appends "-<timestamp>" to the save key and "-" to each restore key. So restore-keys must NOT
      # end in "-" itself, or it becomes "ccache-Windows-x64--" and never matches a saved entry.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: ccache
          max-size: "6G"
          save: ${{ github.ref_name == 'develop' }}
          key: ${{ runner.os }}-x64-${{ github.sha }}
          restore-keys: ${{ runner.os }}-x64
      # MSBuild's CLToolExe hook runs the tool with cl.exe's own arguments (one @response-file), and
      # ccache only wraps a compiler when it is *named* like one. So hand MSBuild a copy of ccache.exe
      # named cl.exe in a directory that is not on PATH: ccache sees its own name, finds the real
      # cl.exe on PATH (the MSVC one from msvc-dev-cmd, first non-ccache match) and runs it as a
      # child, which is what keeps MSBuild's diagnostics pipe working.
      - name: Stage ccache as cl.exe
        shell: pwsh
        run: |
          $shim = Join-Path $env:RUNNER_TEMP 'ccache-cl'
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          Copy-Item (Get-Command ccache).Source (Join-Path $shim 'cl.exe')
          "CCACHE_CL_DIR=$($shim -replace '\\', '/')" >> $env:GITHUB_ENV
          # MSBuild file logger shared by the build steps below (see "Order matters"). Exported here
          # because runner.temp is not available to a job-level env block.
          "MSBUILD_FLP=/flp:logfile=$env:RUNNER_TEMP/msbuild.log;verbosity=normal;append" >> $env:GITHUB_ENV

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The GenerateSohOtr / Generate2ShipOtr targets run OTRExporter/extract_assets.py via Python3.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Caches the expensive vcpkg dependency build (sdl2, glew, libzip, spdlog, ...), which
      # automate-vcpkg.cmake clones + installs under build/x64/vcpkg. Only the installed tree is kept:
      # vcpkg's buildtrees/downloads/packages are scratch, and the rest of build/x64 (objects, CMake
      # tree) is now covered by ccache above. The old whole-build-dir entries stay reachable through
      # the build-x64- restore key so the first run after this change still finds its vcpkg tree.
      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            build/x64/vcpkg
            !build/x64/vcpkg/buildtrees
            !build/x64/vcpkg/downloads
            !build/x64/vcpkg/packages
          key: vcpkg-x64-${{ hashFiles('CMakeLists.txt', 'CMake/**', 'libultraship/cmake/**') }}
          restore-keys: |
            vcpkg-x64-
            build-x64-

      - name: Configure
        # See build-windows.yml: vcvars points VCPKG_ROOT at the (non-git) VS-bundled vcpkg, which
        # breaks automate-vcpkg.cmake's git pull. Point it at the build-dir vcpkg it clones+caches.
        #
        # ccache wiring for the Visual Studio generator, which ignores CMAKE_<LANG>_COMPILER_LAUNCHER:
        #  - CMAKE_VS_GLOBALS CLToolExe/CLToolPath make MSBuild run the ccache cl.exe staged above in
        #    place of the real cl.exe. CMake's compiler-identification project inherits these globals
        #    too, so it has to work before the first try_compile.
        #  - UseMultiToolTask=true: with /MP (set globally in CMakeLists.txt) the CL task would pass
        #    every source to one cl.exe invocation, which no compiler cache can key. MultiToolTask
        #    invokes the tool once per file and parallelises in MSBuild instead.
        #  - TrackFileAccess=false: keeps MSBuild's file tracker out of the picture. It drops MSBuild's
        #    own up-to-date checks, so a later `cmake --build` step re-runs its dependencies through
        #    ccache; with direct-mode hits (no preprocessor run) that costs seconds, not minutes.
        #  - CMAKE_<LANG>_COMPILER_LAUNCHER is still passed because the CMake tree (CMakeLists.txt,
        #    */CMake/DefaultCXX.cmake) keys off it to pick /Z7 over /Zi; ccache refuses /Zi outright.
        #  - COMBO_RELEASE_DEBUG_INFO=OFF: no compiler debug info in Release. With /Z7 each of soh's
        #    ~1300 objects carries its own copy of the decomp type info and the Release LTCG link died
        #    with LNK1248 (image > 4 GB). The Release PDB was never packaged, so nothing shipped changes.
        #  - 2ship's precompiled header stays ON. sccache refused MSVC PCH compiles outright, and
        #    building 2ship without the PCH (its headers as forced includes instead) made every one of
        #    its 522 C++ files re-parse the libultraship headers the PCH pre-digests: ~10 s each, a
        #    30-minute 2ship step on a cold cache. ccache caches MSVC PCH compiles (/Yu+/Fp since
        #    4.6.1, /Yc since 4.10) given the CCACHE_SLOPPINESS set at job level, so 2ship keeps its
        #    fast misses and gets hits too. If the stats show 2ship never hitting on a warm run (the
        #    .pch bytes would have to be identical run to run), the fallback is
        #    -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON, which the root CMakeLists.txt turns into forced
        #    includes; that trades the 30-minute cold step for free hits.
        env:
          VCPKG_ROOT: ${{ github.workspace }}/build/x64/vcpkg
        run: >-
          cmake -B build/x64 -S . -G "Visual Studio 17 2022" -A x64
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCOMBO_RELEASE_DEBUG_INFO=OFF
          "-DCMAKE_VS_GLOBALS=CLToolExe=cl.exe;CLToolPath=$env:CCACHE_CL_DIR;UseMultiToolTask=true;TrackFileAccess=false"

      # Order matters: libultraship -> soh -> 2ship (soh before 2ship; they share OTRExporter/ZAPD).
      # comboui + ComboShip pull the rest of the runtime in as dependencies. With TrackFileAccess=false
      # each step re-runs its dependencies through ccache; those are direct-mode hits (no cl.exe run),
      # roughly a minute over the whole job, in exchange for per-project timings and a fixed order.
      # MSBUILD_FLP appends every step's tool output to one fuller log on disk (normal verbosity),
      # kept out of the job log and only uploaded on failure.
      - name: Build libultraship
        run: cmake --build build/x64 --target libultraship --config Release -- "$env:MSBUILD_FLP"
      - name: Build soh
        run: cmake --build build/x64 --target soh --config Release -- "$env:MSBUILD_FLP"
      - name: Build 2ship
        run: cmake --build build/x64 --target 2ship --config Release -- "$env:MSBUILD_FLP"
      # Headless seed validator (pulls libultraship/soh/2ship as deps, already built above). Uploaded
      # below so validate-seed.yml can download it from develop instead of doing its own build.
      # Nothing else depends on it, so it is skipped unless a caller asks for the validator.
      - name: Build comborando
        if: inputs.validator
        run: cmake --build build/x64 --target comborando --config Release -- "$env:MSBUILD_FLP"
      - name: Build comboui
        run: cmake --build build/x64 --target comboui --config Release -- "$env:MSBUILD_FLP"
      - name: Build ComboShip
        run: cmake --build build/x64 --target ComboShip --config Release -- "$env:MSBUILD_FLP"

      # On failure, surface the lines leading up to the first "exited with code" from the fuller
      # MSBuild log; the whole log goes up as an artifact for anything that misses.
      - name: Show build failure context
        if: failure()
        shell: pwsh
        run: |
          $ms = Join-Path $env:RUNNER_TEMP 'msbuild.log'
          if (Test-Path $ms) {
            Write-Host '::group::msbuild.log: context before the first "exited with code"'
            Select-String -Path $ms -Pattern 'exited with code' -Context 60,2 | Select-Object -First 1 | ForEach-Object { $_.Context.PreContext; $_.Line; $_.Context.PostContext }
            Write-Host '::endgroup::'
          }
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: ${{ runner.temp }}/msbuild.log
          if-no-files-found: ignore

      # Port asset archives (--norom). GenerateSohOtr/Generate2ShipOtr DEPEND on ZAPD, already built
      # above (hits). They must run before cpack — the ship/2s2h ZIP components install
      # ${CMAKE_BINARY_DIR}/soh/soh.o2r and .../mm/2ship.o2r.
      - name: Generate soh.o2r
        run: cmake --build build/x64 --target GenerateSohOtr --config Release
      - name: Generate 2ship.o2r
        run: cmake --build build/x64 --target Generate2ShipOtr --config Release

      # Hit/miss counts for the whole job. A PR that only touches a few files should show mostly
      # direct-mode hits. "Unsupported compiler option" rising means /Zi or PCH flags crept back in.
      - name: ccache stats
        run: ccache --show-stats --verbose

      # cpack -G ZIP merges the combo/ship/2s2h components into one archive under _packages/.
      # Call cpack directly with -C Release so the multi-config generator can't package Debug by
      # mistake (the build-tree CPackConfig.cmake carries CPACK_PROJECT_CONFIG_FILE from configure).
      - name: Package (cpack ZIP)
        working-directory: build/x64
        run: cpack -G ZIP -C Release

      # Extract the cpack archive before upload. GitHub always zips artifact contents on download, so
      # uploading the .zip directly yields a zip-inside-a-zip; uploading the extracted tree makes the
      # downloaded ComboShip-windows.zip hold the runtime files directly.
      - name: Stage package contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem _packages/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath _packages/stage -Force

      - name: Upload ComboShip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComboShip-windows
          path: _packages/stage
          if-no-files-found: error

      # The raw cpack .zip (not the staged tree) for release.yml to attach directly as a Release asset.
      - name: Upload package zip (release asset)
        if: inputs.release_zip
        uses: actions/upload-artifact@v4
        with:
          name: ComboShip-package-zip
          path: _packages/*.zip
          if-no-files-found: error

      # comborando.exe + its deployed runtime DLLs (no o2r — the reachability oracle needs none).
      # validate-seed.yml downloads this from the latest successful develop run instead of rebuilding.
      - name: Upload comborando validator
        if: inputs.validator
        uses: actions/upload-artifact@v4
        with:
          name: comborando-windows
          path: |
            x64/Release/comborando.exe
            x64/Release/*.dll
          if-no-files-found: error
