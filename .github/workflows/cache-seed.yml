name: Cache seed

# Manually refills develop's compiler caches so PR builds (build-artifacts.yml) restore a useful one.
# Run it from the Actions tab (or `gh workflow run cache-seed.yml --ref develop`).
#
# Why develop: a run can only restore caches saved on its own branch, its PR base branch, or the
# default branch. Every PR targets develop, which is also the default branch, so that is the one
# place a cache is visible to all of them. An entry saved on `main` (the release branch) would not
# be restorable from a PR into develop. build.yml / build-linux.yml only save when the ref is
# develop, so dispatching this from any other branch is refused up front.
#
# develop pushes already save a cache as a side effect of the nightly build. Reach for this when
# PR builds have gone cold (the "ccache stats" step shows mostly misses) and no develop push is
# coming to fix it:
#  - right after a cache-layout change lands, without waiting for the next merge;
#  - GitHub evicted the entries (nobody restored them for 7 days, or the repo's 10 GB budget);
#  - a runner image update changed the compiler, which misses every cached object.
#
# It calls the normal build pipelines with cache_only, so it compiles (restoring, then saving, the
# ccache entry) and skips packaging and uploads. It is a separate file on purpose: validate-seed.yml
# picks develop runs of build-artifacts.yml by file name and pr-artifacts.yml listens for the
# "Build Artifacts" workflow name, and neither should ever see these runs.

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Seed the Windows cache
        type: boolean
        default: true
      linux:
        description: Seed the Linux cache
        type: boolean
        default: true

concurrency:
  group: cache-seed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Require develop
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/develop" ]; then
            echo "::error::Dispatched on $REF. build.yml / build-linux.yml only save the cache from refs/heads/develop, and PRs could not restore an entry saved anywhere else. Re-run with the develop branch selected."
            exit 1
          fi
          echo "Seeding from develop @ ${GITHUB_SHA:0:9}" | tee -a "$GITHUB_STEP_SUMMARY"

  windows:
    needs: check
    if: inputs.windows
    uses: ./.github/workflows/build.yml
    with:
      cache_only: true
      # develop's nightly build compiles comborando too, so seed its objects as well.
      validator: true

  linux:
    needs: check
    if: inputs.linux
    uses: ./.github/workflows/build-linux.yml
    with:
      cache_only: true
